<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundus - Início</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-pele: #F9B17B;
            --cor-cabelo: #4a2e1b;
            --cor-roupa: #2d3748;
            --cor-extra: #00BFFF;
        }

        /* Ajustes para o Mundus Lab no Modal */
        .mundus-lab-registro {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #preview-container-registro {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #00BFFF;
            background: #050a17;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #preview-container-registro svg {
            width: 100%;
            height: 100%;
        }

        .avatar-grid-registro {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .avatar-option-reg {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            background: rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .avatar-option-reg.active {
            border-color: #00BFFF;
            transform: scale(1.1);
        }

        .color-section {
            text-align: left;
            margin-top: 10px;
        }

        .color-section label {
            font-size: 0.7rem;
            color: #888;
            display: block;
            margin-bottom: 5px;
        }

        .palette-reg {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .dot-reg {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .dot-reg.active {
            border-color: white;
            box-shadow: 0 0 5px #00BFFF;
        }

        .flex-inputs {
            display: flex;
            gap: 10px;
        }

        .flex-inputs div {
            flex: 1;
        }

        input[type="color"] {
            width: 100%;
            height: 30px;
            border: none;
            background: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <main class="hero">
        <div class="glass-card">
            <h1>MUNDUS</h1>
            <p>Explore o mundo, conquiste territórios e aprenda geografia jogando.</p>
            
            <div class="button-group">
                <button class="btn-main" onclick="abrirModal('modal-login')">Entrar</button>
                <button class="btn-secondary" onclick="abrirModal('modal-registro')">Criar Conta</button>
            </div>
        </div>
    </main>

    <div id="modal-login" class="modal">
        <div class="modal-content glass-card">
            <span class="close" onclick="fecharModal('modal-login')">&times;</span>
            <h2>Login</h2>
            <form action="/login" method="POST">
                <input type="email" name="email" placeholder="E-mail" required>
                <input type="password" name="senha" placeholder="Senha" required>
                <button type="submit" class="btn-main">Entrar</button>
            </form>
        </div>
    </div>

    <div id="modal-registro" class="modal">
        <div class="modal-content glass-card" style="max-width: 500px;">
            <span class="close" onclick="fecharModal('modal-registro')">&times;</span>
            <h2>Cadastro</h2>
            <form action="/registrar" method="POST" id="form-registro">
                
                <input type="text" name="nome" placeholder="Nome de Usuário" required>
                <input type="email" name="email" placeholder="E-mail" required>
                <input type="password" name="senha" placeholder="Senha" required>

                <div class="mundus-lab-registro">
                    <div id="preview-container-registro">
                        </div>

                    <div class="avatar-grid-registro">
                        {% for i in range(1, 7) %}
                        <img src="{{ url_for('static', filename='avatars/agente0' ~ i ~ '.svg') }}" 
                             class="avatar-option-reg" 
                             onclick="selecionarAgente(this)">
                        {% endfor %}
                    </div>

                    <div class="color-section">
                        <label>TOM DE PELE</label>
                        <div class="palette-reg" id="pele-palette">
                            <div class="dot-reg" style="background: #F9B17B;" onclick="setCorPele('#F9B17B', this)"></div>
                            <div class="dot-reg" style="background: #EAA476;" onclick="setCorPele('#EAA476', this)"></div>
                            <div class="dot-reg" style="background: #D5855B;" onclick="setCorPele('#D5855B', this)"></div>
                            <div class="dot-reg" style="background: #8A5D3B;" onclick="setCorPele('#8A5D3B', this)"></div>
                        </div>

                        <div class="flex-inputs">
                            <div>
                                <label>CABELO</label>
                                <input type="color" name="avatar_cabelo" id="reg-cabelo" value="#4a2e1b" oninput="atualizarCores()">
                            </div>
                            <div>
                                <label>ROUPA</label>
                                <input type="color" name="avatar_roupa" id="reg-roupa" value="#2d3748" oninput="atualizarCores()">
                            </div>
                        </div>
                    </div>
                </div>

                <input type="hidden" name="avatar_url" id="reg-url" value="agente01.svg">
                <input type="hidden" name="avatar_pele" id="reg-pele" value="#F9B17B">
                <input type="hidden" name="avatar_extra" value="#00BFFF">

                <button type="submit" class="btn-main" style="margin-top: 15px;">Criar Conta</button>
            </form>
        </div>
    </div>

    <script>
        function abrirModal(id) { document.getElementById(id).style.display = "flex"; }
        function fecharModal(id) { document.getElementById(id).style.display = "none"; }

        async function selecionarAgente(el) {
            document.querySelectorAll('.avatar-option-reg').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            
            const nomeFicheiro = el.src.split('/').pop();
            document.getElementById('reg-url').value = nomeFicheiro;

            try {
                const res = await fetch(el.src);
                const svg = await res.text();
                document.getElementById('preview-container-registro').innerHTML = svg;
                atualizarCores();
            } catch (e) { console.error(e); }
        }

        function setCorPele(cor, el) {
            document.querySelectorAll('.dot-reg').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('reg-pele').value = cor;
            atualizarCores();
        }

        function atualizarCores() {
            const root = document.documentElement;
            root.style.setProperty('--cor-pele', document.getElementById('reg-pele').value);
            root.style.setProperty('--cor-cabelo', document.getElementById('reg-cabelo').value);
            root.style.setProperty('--cor-roupa', document.getElementById('reg-roupa').value);
        }

        window.onclick = function(event) {
            if (event.target.className === "modal") {
                event.target.style.display = "none";
            }
        }

        // Inicialização
        window.onload = () => {
            const prim = document.querySelector('.avatar-option-reg');
            if(prim) selecionarAgente(prim);
            const primPele = document.querySelector('.dot-reg');
            if(primPele) setCorPele('#F9B17B', primPele);
        };
    </script>
</body>
</html>
