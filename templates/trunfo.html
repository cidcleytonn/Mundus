<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mundus - Trunfo Demográfico</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap');

        :root {
            --bg-main: #0a1128;
            --header-bg: rgba(10, 17, 40, 0.95);    
            --card-bg: linear-gradient(145deg, #7c3aed, #a855f7); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --color-correct: #10b981;
            --color-incorrect: #ef4444;
            --color-accent: #00BFFF;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            
            /* Variáveis dinâmicas do Avatar (Fallback) */
            --cor-pele: #F9B17B;
            --cor-cabelo: #4a2e1b;
            --cor-roupa: #2d3748;
            --cor-extra: #00BFFF;
        }

        body.light-mode {
            --bg-main: #f0fdfa;
            --header-bg: #ffffff; 
            --card-bg: linear-gradient(145deg, #8b5cf6, #a855f7);
            --glass-border: rgba(0,0,0,0.05);
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; height: 100dvh; display: flex; flex-direction: column; background: var(--bg-main); color: #fff; overflow: hidden; transition: 0.5s ease;}
        
        header { position: relative; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: var(--header-bg); backdrop-filter: blur(20px); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 800; display: flex; align-items: center; gap: 12px; color: var(--text-main); text-decoration: none;}
        body.light-mode .logo { color: #0f172a; }
        .logo img { width: 45px; height: 45px; border-radius: 12px; object-fit: cover;}
        
        .nav-controls { display: flex; gap: 15px; align-items: center;}
        
        .user-badge { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); }
        .user-badge strong { color: var(--color-accent); font-family: 'Space Grotesk', sans-serif;}
        
        .btn-logout { color: #ef4444; text-decoration: none; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; padding: 10px 20px; border-radius: 20px; background: rgba(239, 68, 68, 0.1); transition: 0.3s; }
        
        .timer-container { width: 100%; height: 8px; background: rgba(0,0,0,0.1); position: relative;}
        .timer-bar { height: 100%; width: 100%; background: #fbbf24; transition: width 0.1s linear, background-color 0.3s; box-shadow: 0 0 10px #fbbf24;}

        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; overflow-y: auto;}
        
        .score-board { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 20px; background: rgba(0,0,0,0.1); padding: 10px 25px; border-radius: 30px;}
        body.light-mode .score-board { background: #e2e8f0; }
        .score-board span { color: #8b5cf6; font-size: 1.6rem; }

        .arena-monolito { display: flex; flex-direction: column; width: 100%; max-width: 450px; background: var(--card-bg); border-radius: 40px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.25); border: 4px solid rgba(255,255,255,0.1); color: white; }

        .arena-ref { padding: 25px 20px; background: rgba(0,0,0,0.2); display: flex; align-items: center; gap: 20px; position: relative; }
        .ref-flag-box { width: 85px; height: 60px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); object-fit: cover; flex-shrink: 0;}
        .ref-info { flex: 1; display: flex; flex-direction: column; align-items: flex-end; text-align: right;}
        .ref-info span { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.7); margin-bottom: 5px; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 15px;}
        .ref-info h3 { margin: 0; font-size: 1.4rem; font-family: 'Space Grotesk', sans-serif; font-weight: 800;}
        .ref-info .population-text { font-size: 1.8rem; font-weight: 800; color: #fbbf24; font-family: 'Space Grotesk', sans-serif; line-height: 1; margin-top: 5px;}

        .arena-challenge { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .challenge-flag-box { width: 160px; height: 110px; border-radius: 16px; border: 4px solid rgba(255,255,255,0.2); object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 25px;}
        .arena-challenge h2 { margin: 0 0 5px 0; font-size: 2.5rem; font-family: 'Space Grotesk', sans-serif; font-weight: 800; line-height: 1;}
        .arena-challenge p { font-size: 1.1rem; color: rgba(255,255,255,0.8); margin: 0 0 35px 0; font-weight: 500;}

        .btn-row { display: flex; gap: 15px; width: 100%; }
        .btn-action { flex: 1; padding: 25px 10px; font-size: 1.2rem; font-weight: 800; font-family: 'Inter', sans-serif; border-radius: 30px; border: none; cursor: pointer; color: white; transition: all 0.2s; box-shadow: 0 8px 0 rgba(0,0,0,0.2); text-transform: uppercase; letter-spacing: 1px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
        .btn-action span { font-size: 1.8rem; line-height: 0.8;}
        .btn-maior { background-color: var(--color-correct); }
        .btn-menor { background-color: var(--color-incorrect); }
        .btn-action:hover { transform: translateY(-5px); box-shadow: 0 13px 0 rgba(0,0,0,0.2); }
        .btn-action:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,0.2); }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 17, 40, 0.95); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px);}
        body.light-mode .overlay { background: rgba(240, 253, 250, 0.95); }
        .overlay h1 { font-family: 'Space Grotesk', sans-serif; font-size: 3.5rem; margin: 0; color: var(--color-incorrect); font-weight: 800;}
        .overlay p { font-size: 1.2rem; margin-bottom: 20px; color: var(--text-muted); font-weight: 500;}
        .overlay span { font-size: 5rem; font-weight: 800; color: #8b5cf6; font-family: 'Space Grotesk', sans-serif; line-height: 1;}
        .btn-home { padding: 20px 50px; background: #8b5cf6; color: white; text-decoration: none; border-radius: 50px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-top: 40px; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); transition: 0.3s;}
        .btn-home:hover { transform: translateY(-3px); background: #7c3aed;}

        @media (max-width: 500px) {
            .arena-monolito { max-width: 100%; border-radius: 30px;}
            .arena-ref { padding: 15px; }
            .ref-flag-box { width: 70px; height: 48px; }
            .ref-info .population-text { font-size: 1.4rem; }
            .arena-challenge { padding: 30px 15px; }
            .challenge-flag-box { width: 130px; height: 90px; }
            .arena-challenge h2 { font-size: 2rem; }
            .btn-action { padding: 20px 10px; font-size: 1.1rem;}
            .user-badge { display: none; } /* Esconde o nome em ecrãs pequenos para não quebrar o layout */
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo"><img src="{{ url_for('static', filename='mundus.png') }}" alt="Mundus Logo"> Mundus</a>
        <div class="nav-controls">
            {% if nome_jogador %}
            <div class="perfil-usuario" style="display: flex; align-items: center; gap: 10px;">
                <div id="header-avatar" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--color-accent); background: rgba(0,0,0,0.2); overflow: hidden; display: flex; justify-content: center; align-items: center;"></div>
                <span class="user-badge">Agente: <strong>{{ nome_jogador }}</strong></span>
            </div>
            {% endif %}
            <a href="/" class="btn-logout">Sair do Jogo</a>
        </div>
    </header>

    <div class="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
    </div>

    <main>
        <div class="score-board">ACERTOS: <span id="score-display">0</span></div>

        <div class="arena-monolito" id="challenge-card">
            
            <div class="arena-ref">
                <img src="" alt="Referência" class="ref-flag-box" id="ref-flag">
                <div class="ref-info">
                    <span>Base Atual</span>
                    <h3 id="ref-name">País</h3>
                    <div class="population-text" id="ref-pop">0</div>
                </div>
            </div>

            <div class="arena-challenge">
                <img src="" alt="Desafio" class="challenge-flag-box" id="challenge-flag">
                <h2 id="challenge-name">País</h2>
                <p>A população é maior ou menor?</p>
                <div class="btn-row">
                    <button class="btn-action btn-menor" onclick="fazerJogada(false)">
                        <span>▼</span> MENOR
                    </button>
                    <button class="btn-action btn-maior" onclick="fazerJogada(true)">
                        <span>▲</span> MAIOR
                    </button>
                </div>
            </div>

        </div>

        <div class="overlay" id="game-over">
            <h1>FIM DE JOGO!</h1>
            <p>A tua pontuação final foi de</p>
            <span id="final-score">0</span>
            <a href="/" class="btn-home">Menu Principal</a>
        </div>
    </main>

    <script>
        let paises = {{ paises_js | safe }};
        let index = 0;
        let score = 0;
        let jogando = true;
        
        let paisReferencia = paises[index];
        let paisDesafio = paises[index + 1];

        const tempoTotal = 15000;
        let tempoRestante = tempoTotal;
        const barraTempo = document.getElementById('timer-bar');
        let timerInterval;

        function formatarNumero(num) { return num.toLocaleString('pt-BR'); }

        function atualizarUI() {
            if(index >= paises.length - 1) { encerrarJogo(); return; }
            paisReferencia = paises[index];
            paisDesafio = paises[index + 1];

            document.getElementById('ref-flag').src = `https://flagcdn.com/w320/${paisReferencia.iso.toLowerCase()}.png`;
            document.getElementById('ref-name').innerText = paisReferencia.nome;
            document.getElementById('ref-pop').innerText = formatarNumero(paisReferencia.populacao);

            document.getElementById('challenge-flag').src = `https://flagcdn.com/w320/${paisDesafio.iso.toLowerCase()}.png`;
            document.getElementById('challenge-name').innerText = paisDesafio.nome;
            
            document.getElementById('score-display').innerText = score;
            
            const card = document.getElementById('challenge-card');
            card.style.transform = 'scale(0.95)';
            setTimeout(() => { card.style.transform = 'scale(1)'; }, 150);
        }

        function iniciarTimer() {
            timerInterval = setInterval(() => {
                if(!jogando) return;
                tempoRestante -= 50;
                let pct = (tempoRestante / tempoTotal) * 100;
                barraTempo.style.width = pct + '%';
                
                if (pct < 30) barraTempo.style.backgroundColor = '#ef4444'; 
                else barraTempo.style.backgroundColor = '#fbbf24';

                if(tempoRestante <= 0) encerrarJogo();
            }, 50);
        }

        function fazerJogada(escolheuMaior) {
            if(!jogando) return;
            let popDesafio = paisDesafio.populacao;
            let popRef = paisReferencia.populacao;

            if ( (escolheuMaior && popDesafio >= popRef) || (!escolheuMaior && popDesafio <= popRef) ) {
                score++;
                tempoRestante = Math.min(tempoTotal, tempoRestante + 4000); 
                index++;
                atualizarUI();
            } else {
                encerrarJogo();
            }
        }

        function encerrarJogo() {
            jogando = false;
            clearInterval(timerInterval);
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('final-score').innerText = score;
        }

        if (localStorage.getItem('geoTheme') === 'light') document.body.classList.add('light-mode');
        atualizarUI();
        iniciarTimer();
    </script>
    
    {% if nome_jogador %}
    <script>
        // Script de injeção e cores do Avatar
        const root = document.documentElement;
        root.style.setProperty('--cor-pele', '{{ session.get("cor_pele", "#F9B17B") }}');
        root.style.setProperty('--cor-cabelo', '{{ session.get("cor_cabelo", "#4a2e1b") }}');
        root.style.setProperty('--cor-roupa', '{{ session.get("cor_roupa", "#2d3748") }}');
        root.style.setProperty('--cor-extra', '{{ session.get("cor_extra", "#00BFFF") }}');

        async function carregarAvatarHeader() {
            try {
                const avatarUrl = "{{ url_for('static', filename='avatars/' + session.get('avatar_url', 'agente01.svg')) }}";
                const res = await fetch(avatarUrl);
                const svgText = await res.text();
                const container = document.getElementById('header-avatar');
                if (container) {
                    container.innerHTML = svgText;
                    const svgElement = container.querySelector('svg');
                    if(svgElement) {
                        svgElement.style.width = '100%';
                        svgElement.style.height = '100%';
                    }
                }
            } catch (e) { console.error(e); }
        }
        carregarAvatarHeader();
    </script>
    {% endif %}
</body>
</html>
